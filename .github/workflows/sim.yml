# Runs the Arduino port's Wokwi scenarios on the virtual M5Dial (sketch/sim).
# Early subset of the full CI (Task 17 extends this: host tests, build matrix).
# Runs every scenario under sketch/sim/scenarios/<Sketch>/*.test.yaml against the
# sketch examples/<Sketch> (or <Sketch> for top-level sketches such as UserDemo).
name: sim

on:
  workflow_dispatch:
  push:
    branches: ['port/**']
    paths:
      - 'sketch/**'
      - '.github/workflows/sim.yml'

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read pinned versions
        id: deps
        # why: sketch/tools/deps.txt is the single source of truth for versions
        run: |
          . sketch/tools/deps.txt
          echo "arduino_cli=$ARDUINO_CLI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            sketch/.arduino
            sketch/tools/bin
            sketch/tools/wasi-sdk
            sketch/tools/.venv
          key: sim-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sketch/tools/deps.txt', 'sketch/tools/setup.sh') }}

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: ${{ steps.deps.outputs.arduino_cli }}

      - name: Setup toolchain
        run: sketch/tools/setup.sh

      - name: Chip host tests
        run: for m in sketch/sim/chips/*/Makefile; do make -C "$(dirname "$m")" test; done

      - name: Run scenarios
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        working-directory: sketch
        # why: one tools/sim_ci.sh call for all scenarios (verdict logic unit-tested in
        # tools/tests/test_sim_ci.py): a Wokwi transport drop (code 1006) is retried once; a
        # used-up Wokwi CI minute quota marks this and the remaining scenarios SKIPPED (warning +
        # step summary) without failing the job; all scenarios run even if one fails, and the
        # step fails if any scenario failed.
        run: |
          pairs=()
          for scenario in sim/scenarios/*/*.test.yaml; do
            name="$(basename "$(dirname "$scenario")")"
            sketch="examples/$name"; [ -d "$sketch" ] || sketch="$name"
            pairs+=("$sketch" "$scenario")
          done
          tools/sim_ci.sh --timeout-ms 60000 "${pairs[@]}"

      - name: Upload sim output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sim-output
          path: |
            sketch/.build/sim-out/
            sketch/sim/wokwi.toml
          if-no-files-found: warn
