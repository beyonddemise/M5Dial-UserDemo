# Runs the Arduino port's Wokwi scenarios on the virtual M5Dial (sketch/sim).
# Build, host tests, Python tool tests and chip host tests/wasm builds (no Wokwi quota) are in
# sketch.yml; this workflow holds only the quota-spending job.
# Job `scenario`: every sketch/sim/scenarios/<Sketch>/*.test.yaml against examples/<Sketch>
# (or <Sketch>, e.g. UserDemo) - only on workflow_dispatch and on same-repo pull requests that
# carry the `sim` label, because each scenario costs Wokwi CI minutes (free-plan monthly quota).
# Adding the label starts a run; without it the job is skipped (a skipped job passes branch
# protection). Opt-in since the first real run (PR #38): a full run is ~20 CI minutes.
name: sim

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
    paths:
      - 'sketch/sim/**'
      - 'sketch/examples/**'
      - 'sketch/libraries/M5DialDemo/**'
      - 'sketch/UserDemo/**'
      # why: the scenario toolchain (sim.sh, sim_ci.sh, build.sh, setup.sh, deps.txt pins of
      # wokwi-cli and the core); still label-gated, so no extra quota
      - 'sketch/tools/**'
      - '.github/workflows/sim.yml'

permissions:
  contents: read

# why: a newer run for the same ref supersedes the old one (no Wokwi minutes for stale commits).
# A label event for any label other than `sim` gets its own group (run id): its scenario job is
# skipped, and in the shared group it would cancel a running scenario job and show a pass.
concurrency:
  group: >-
    sim-${{ github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'sim'
    && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  scenario:
    # why: never on push (quota); on PRs only from this repo, so fork PRs never see the token;
    # only with the `sim` label, and on a `labeled` event only when that label was the one added
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'sim') &&
       (github.event.action != 'labeled' || github.event.label.name == 'sim'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read pinned versions
        id: deps
        # why: sketch/tools/deps.txt is the single source of truth for versions
        run: |
          . sketch/tools/deps.txt
          echo "arduino_cli=$ARDUINO_CLI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            sketch/.arduino
            sketch/tools/bin
            sketch/tools/wasi-sdk
            sketch/tools/.venv
          key: sim-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sketch/tools/deps.txt', 'sketch/tools/setup.sh') }}

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: ${{ steps.deps.outputs.arduino_cli }}

      - name: Setup toolchain
        run: sketch/tools/setup.sh

      - name: Quota gate (chip host tests, sim_ci verdict tests)
        # why: the full test suite runs in sketch.yml, but scenarios must not spend Wokwi minutes
        # on a broken chip model or a broken quota/retry verdict in sim_ci.sh (both were the
        # `needs: chips` + tool-test gate here before sketch.yml existed); seconds, no quota
        run: |
          for m in sketch/sim/chips/*/Makefile; do make -C "$(dirname "$m")" test; done
          sketch/tools/.venv/bin/python -m unittest discover -s sketch/tools/tests -p test_sim_ci.py

      - name: Run scenarios
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        working-directory: sketch
        # why: every scenario finishes within a few simulated seconds; 20 s of simulated time
        # bounds the wall time a hanging scenario can burn from the Wokwi CI minute quota.
        # One tools/sim_ci.sh call for all scenarios (verdict logic unit-tested in
        # tools/tests/test_sim_ci.py). Retries: only for Wokwi transport drops ("Connection to
        # transport closed unexpectedly: code 1006"), never for a real failure. A used-up quota
        # marks this and the remaining scenarios SKIPPED (warning + step summary) without failing
        # the job: a billing condition, not a test result. All other scenarios run even if one
        # fails; the step fails if any scenario failed.
        run: |
          pairs=()
          for scenario in sim/scenarios/*/*.test.yaml; do
            name="$(basename "$(dirname "$scenario")")"
            sketch="examples/$name"; [ -d "$sketch" ] || sketch="$name"
            pairs+=("$sketch" "$scenario")
          done
          tools/sim_ci.sh --timeout-ms 20000 "${pairs[@]}"

      - name: Upload sim output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sim-output
          path: |
            sketch/.build/sim-out/
            sketch/sim/wokwi.toml
          if-no-files-found: warn
