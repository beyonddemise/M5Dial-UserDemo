# DialProbe on the virtual M5Dial: every peripheral in one Wokwi session (one session per
# sketch keeps the Wokwi CI-minute cost down).
# Run: tools/sim.sh examples/DialProbe sim/scenarios/DialProbe/probe.test.yaml
#
# Parts (sim/diagram.json): btn = front button GPIO42, touch = ft3267, rtc = pcf8563,
# rfid = ws1850s, enc = encoder chip on GPIO41 (A) / GPIO40 (B).
name: 'DialProbe: all peripherals'
version: 1
steps:
  # --- init: board autodetect + every probe answers
  # why this order: m5dd::begin logs `boot:` and the RFID presence probe before DialProbe's
  # own init lines
  - wait-serial: 'boot: DialProbe'
  - wait-serial: 'init: rfid ok'
  # why: m5::board_t::board_M5Dial == 12 (M5GFX src/lgfx/boards.hpp:23), proves the display chip
  - wait-serial: 'init: board 12'
  - wait-serial: 'init: display 240x240'
  - wait-serial: 'init: rtc ok'
  - wait-serial: 'init: touch ok'
  - wait-serial: 'probe: ready'

  # --- rtc: starts from the host's UTC time (20xx) and ticks; DialProbe logs it at 1 Hz
  - wait-serial: 'rtc: 20'
  - wait-serial: 'rtc: 20'

  # --- button: press and release edges (active low)
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - wait-serial: 'btn: pressed'
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'btn: released'

  # --- touch at (120, 60)
  - set-control: { part-id: touch, control: x, value: 120 }
  - set-control: { part-id: touch, control: y, value: 60 }
  - set-control: { part-id: touch, control: touched, value: 1 }
  - wait-serial: 'touch: x=120 y=60'
  - set-control: { part-id: touch, control: touched, value: 0 }

  # --- encoder: one clockwise detent -> steps=1, one counter-clockwise -> steps=-1
  # `steps` emits that many detents (positive = clockwise, A leads B); 0 re-arms it.
  # why: edgeIntervalUs 40 ms - a slow, unambiguous turn; checks direction and detent size only
  # (the fast steps below check counting under load).
  - set-control: { part-id: enc, control: edgeIntervalUs, value: 40000 }
  - set-control: { part-id: enc, control: steps, value: 1 }
  - wait-serial: 'enc: steps=1 '
  - set-control: { part-id: enc, control: steps, value: 0 }
  - set-control: { part-id: enc, control: steps, value: -1 }
  - wait-serial: 'enc: steps=-1 '

  # --- encoder fast (Review Focus 2): 20 quick clockwise detents while DialProbe pushes its
  # full 240x240 canvas every loop; the interrupt-driven DialEncoder must count every edge.
  # State here: raw 0, total 0. `enc:` step lines carry total = sum of all steps; DialProbe
  # prints `enc: idle raw=<n> total=<n>` once the knob has rested for 100 ms.
  # why edgeIntervalUs 500: an edge every 0.5 ms, ~20+ edges per canvas push - a polled
  # encoder (M5Dial.Encoder on GPIO40/41) loses or mis-guesses edges at this rate.
  # why the idle line: EncoderDetent's window is centred on the rest positions (detent 0 =
  # raw -2..+1), so clockwise (raw counts down, CW_SIGN -1) reaches total=20 already at raw
  # -79; only the raw count at rest is exact. `idle raw=-80 total=20` proves all 80 edges were
  # counted and the steps sum to exactly +20 - with exact counting a one-way turn cannot
  # produce a negative step (wait-serial cannot assert that a line is absent).
  - set-control: { part-id: enc, control: edgeIntervalUs, value: 500 }
  - set-control: { part-id: enc, control: steps, value: 20 }
  - wait-serial: 'total=20 '
  - wait-serial: 'enc: idle raw=-80 total=20'
  # Back through 0 with 40 counter-clockwise detents: must rest at exactly raw +80, total -20.
  # why two -20 turns: the `steps` control is limited to -20..20; the delays let the chip
  # (polls `steps` every 1 ms) see each value. `idle raw=80 total=-20` is unique here.
  - set-control: { part-id: enc, control: steps, value: 0 }
  - delay: 10ms
  - set-control: { part-id: enc, control: steps, value: -20 }
  - delay: 200ms
  - set-control: { part-id: enc, control: steps, value: 0 }
  - delay: 10ms
  - set-control: { part-id: enc, control: steps, value: -20 }
  - wait-serial: 'enc: idle raw=80 total=-20'

  # --- rfid: card DE:AD:BE:EF (REQA, CL1 anticollision, SELECT)
  - set-control: { part-id: rfid, control: uid0, value: 222 }
  - set-control: { part-id: rfid, control: uid1, value: 173 }
  - set-control: { part-id: rfid, control: uid2, value: 190 }
  - set-control: { part-id: rfid, control: uid3, value: 239 }
  - set-control: { part-id: rfid, control: cardPresent, value: 1 }
  - wait-serial: 'rfid: uid=DE:AD:BE:EF'
