# UserDemo on the virtual M5Dial: launcher boot, encoder navigation, button open/return and
# touch selection - all in ONE Wokwi session (one session per sketch keeps CI minutes down).
# Run: tools/sim.sh UserDemo sim/scenarios/UserDemo/launcher.test.yaml
#
# Parts (sim/diagram.json): btn = front button GPIO42, touch = ft3267, enc = encoder chip on
# GPIO41 (A) / GPIO40 (B). `enc.steps` emits that many detents (positive = clockwise), 0 re-arms.
# Launcher slots (launcher_layout.h): 0 LcdTest, 1 RtcTest, 2 RfidTest, 3 Brightness,
# 4 WifiScan, 5 BleServer, 6 TempDemo, 7 MoreMenu, 8/9 empty ("-"). Ported apps log
# `app: open <Class>` / `app: close <Class>`; an entry not ported yet logs
# `app: <name> not ported`; either way the launcher logs `launcher: ready` when back.
name: 'UserDemo: launcher'
version: 1
steps:
  # --- plain boot (no button hold): straight to the launcher
  # why no hold any more: holding the button > 1 s at boot now enters the factory test, which
  # ends with a power-off (covered by enter/skip_io/io_leds.test.yaml in their own sessions).
  # wait-serial cannot assert that no `factory:` line came; the device smoke covers that:
  #   device_test.py UserDemo --expect 'boot: UserDemo' 'launcher: ready' --forbid 'factory:'
  - wait-serial: 'boot: UserDemo'
  - wait-serial: 'launcher: ready'

  # --- clockwise = next item (Review Focus 3)
  # why edgeIntervalUs 40 ms: a slow, unambiguous turn; checks direction and one step per detent
  - set-control: { part-id: enc, control: edgeIntervalUs, value: 40000 }
  - set-control: { part-id: enc, control: steps, value: 1 }
  - wait-serial: 'launcher: select 1 RtcTest'
  - set-control: { part-id: enc, control: steps, value: 0 }
  - delay: 10ms

  # --- counter-clockwise back to 0, then once more: wraps to the last ring slot
  # why 9, not 7 (plan text): the original menu has 10 ring slots (n = 10) for 8 icons and loop
  # mode on, so goLast() from 0 lands on empty slot 9 ("-. -" tag) - kept as in the original.
  - set-control: { part-id: enc, control: steps, value: -1 }
  - wait-serial: 'launcher: select 0 LcdTest'
  - set-control: { part-id: enc, control: steps, value: 0 }
  - delay: 10ms
  - set-control: { part-id: enc, control: steps, value: -1 }
  - wait-serial: 'launcher: select 9 -'
  - set-control: { part-id: enc, control: steps, value: 0 }
  - delay: 10ms
  - set-control: { part-id: enc, control: steps, value: 1 }
  - wait-serial: 'launcher: select 0 LcdTest'
  - set-control: { part-id: enc, control: steps, value: 0 }

  # --- press, hold 500 ms, release opens the selected app (Review Focus 1)
  # why: the launcher waits for the release in a loop; without M5Dial.update() in that loop
  # BtnA never sees the release and the launcher hangs - the next line would never come.
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 500ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: open LCD_Test'
  - wait-serial: 'lcd: pattern 0'
  # LCD_Test: one clockwise detent inside the app, then a click quits back to the launcher
  - set-control: { part-id: enc, control: steps, value: 1 }
  - wait-serial: 'lcd: pattern 1'
  - set-control: { part-id: enc, control: steps, value: 0 }
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: close LCD_Test'
  - wait-serial: 'launcher: ready'

  # --- RTC_Test: select slot 1, open with a click, one clock line, quit
  - set-control: { part-id: enc, control: steps, value: 1 }
  - wait-serial: 'launcher: select 1 RtcTest'
  - set-control: { part-id: enc, control: steps, value: 0 }
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: open RTC_Test'
  - wait-serial: 'rtc: 20'
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: close RTC_Test'
  - wait-serial: 'launcher: ready'

  # --- Set_Brightness: two detents to slot 3, open, current value logged, quit unchanged
  - set-control: { part-id: enc, control: steps, value: 2 }
  - wait-serial: 'launcher: select 3 Brightness'
  - set-control: { part-id: enc, control: steps, value: 0 }
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: open Set_Brightness'
  - wait-serial: 'brightness: '
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: close Set_Brightness'
  - wait-serial: 'launcher: ready'

  # --- WiFi_Scan: one detent to slot 4, open, one scan result, quit (Wi-Fi off, heap logged)
  - set-control: { part-id: enc, control: steps, value: 1 }
  - wait-serial: 'launcher: select 4 WifiScan'
  - set-control: { part-id: enc, control: steps, value: 0 }
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: open WiFi_Scan'
  - wait-serial: 'wifi: ap_count='
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'wifi: heap='
  - wait-serial: 'app: close WiFi_Scan'
  - wait-serial: 'launcher: ready'

  # --- BLE_Server: one detent to slot 5, open, quit. Open/close only: Wokwi has no BLE, so
  # nothing BLE-side (advertising, connect, notify) is checked here (docs/PORTING_NOTES.md)
  - set-control: { part-id: enc, control: steps, value: 1 }
  - wait-serial: 'launcher: select 5 BleServer'
  - set-control: { part-id: enc, control: steps, value: 0 }
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: open BLE_Server'
  - delay: 500ms
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: close BLE_Server'
  - wait-serial: 'launcher: ready'

  # --- TempDemo: one detent to slot 6, open, one warmer step, quit
  - set-control: { part-id: enc, control: steps, value: 1 }
  - wait-serial: 'launcher: select 6 TempDemo'
  - set-control: { part-id: enc, control: steps, value: 0 }
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: open TempDemo'
  - wait-serial: 'temp: target=22'
  - wait-serial: 'temp: frame'
  - set-control: { part-id: enc, control: steps, value: 1 }
  - wait-serial: 'temp: target=23'
  - set-control: { part-id: enc, control: steps, value: 0 }
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: close TempDemo'
  - wait-serial: 'launcher: ready'

  # --- touch an icon: selects it (icon 2 RfidTest at (149, 210), launcher_layout::ringPoint)
  - set-control: { part-id: touch, control: x, value: 149 }
  - set-control: { part-id: touch, control: y, value: 210 }
  - set-control: { part-id: touch, control: touched, value: 1 }
  - wait-serial: 'launcher: select 2 RfidTest'
  - set-control: { part-id: touch, control: touched, value: 0 }
  # why 400 ms: the centre tap only opens once the 300 ms selector animation has finished
  - delay: 400ms

  # --- touch the centre circle: opens the selected app (RFID_Test), a click quits back
  - set-control: { part-id: touch, control: x, value: 120 }
  - set-control: { part-id: touch, control: y, value: 120 }
  - set-control: { part-id: touch, control: touched, value: 1 }
  - wait-serial: 'app: open RFID_Test'
  - wait-serial: 'rfid: ready'
  - set-control: { part-id: touch, control: touched, value: 0 }
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - wait-serial: 'app: close RFID_Test'
  - wait-serial: 'launcher: ready'
